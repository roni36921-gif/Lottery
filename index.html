
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">
<title>KR KHAN - Royal Results</title>

<style>
:root{
  --bg:#080808;
  --panel:#141414;
  --gold:#d6ad55;
  --gold2:#f8df91;
  --text:#f5f5f5;
  --muted:#999;
  --border:rgba(214,173,85,.25);
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
}
.container{width:94%;max-width:950px;margin:auto}
header{
  background:linear-gradient(135deg,#17130b,#080808);
  border-bottom:1px solid var(--border);
  padding:20px 0;
}
.brand{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
}
.logo{width:65px;height:65px;flex-shrink:0}
.brand-name{
  font-size:29px;
  font-weight:900;
  letter-spacing:3px;
  color:var(--gold2);
  text-shadow:0 0 15px rgba(214,173,85,.3);
}
.brand-sub{
  font-size:10px;
  letter-spacing:4px;
  color:var(--gold);
  margin-top:5px;
  text-align:center;
}
.tagline{
  text-align:center;
  color:#aaa;
  font-size:10px;
  letter-spacing:2px;
  margin-top:13px;
}
.top-info{
  display:flex;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
  margin:18px 0;
  color:var(--muted);
  font-size:12px;
}
.status{color:#5de69b}
.error{color:#ff7979}
.tabs{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
  margin:20px 0;
}
.tab{
  border:1px solid var(--border);
  background:#151515;
  color:#aaa;
  padding:15px 5px;
  border-radius:9px;
  font-size:14px;
  font-weight:bold;
  cursor:pointer;
}
.tab.active{
  color:#111;
  background:linear-gradient(135deg,var(--gold2),var(--gold));
  border-color:var(--gold);
}
.panel{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:13px;
  padding:12px;
  margin-bottom:16px;
}
.image-wrap{
  width:100%;
  overflow:hidden;
  border-radius:8px;
  background:#090909;
}
.result-image{
  display:block;
  width:100%;
  height:auto;
  object-fit:contain;
  border-radius:8px;
}
.empty{
  text-align:center;
  color:#aaa;
  padding:45px 12px;
  line-height:1.8;
  font-size:14px;
}
.loading{color:var(--gold2)}
.ad-box{
  min-height:65px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:15px auto;
  text-align:center;
}
.ad-label{color:#444;font-size:10px}
footer{
  text-align:center;
  padding:25px 10px;
  color:#888;
  border-top:1px solid var(--border);
  margin-top:25px;
  font-size:12px;
  line-height:2;
}
footer strong{color:var(--gold)}
@media(max-width:550px){
  .container{width:93%}
  .brand-name{font-size:24px}
  .logo{width:55px;height:55px}
  .panel{padding:8px}
  .tab{font-size:12px;padding:14px 3px}
}
</style>
</head>

<body>

<header>
  <div class="container">
    <div class="brand">
      <svg class="logo" viewBox="0 0 100 100"
        xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#fff0b5"/>
            <stop offset="45%" stop-color="#d6ad55"/>
            <stop offset="100%" stop-color="#8c6425"/>
          </linearGradient>
        </defs>
        <path d="M50 3 L94 27 L94 73 L50 97 L6 73 L6 27 Z"
          fill="none" stroke="url(#gold)" stroke-width="3"/>
        <path d="M25 25 V75 M25 50 L52 25 M35 43 L58 75"
          fill="none" stroke="url(#gold)" stroke-width="7"
          stroke-linecap="square" stroke-linejoin="miter"/>
        <path d="M58 25 L76 75 M76 25 L58 75"
          fill="none" stroke="url(#gold)" stroke-width="5"/>
      </svg>

      <div>
        <div class="brand-name">KR KHAN</div>
        <div class="brand-sub">ROYAL RESULTS</div>
      </div>
    </div>

    <div class="tagline">PREMIUM • LIVE • DAILY UPDATES</div>
  </div>
</header>

<main class="container">

  <div class="top-info">
    <span id="dateText">Loading date...</span>
    <span id="connection" class="status">● Connecting...</span>
  </div>

  <div class="ad-box">
    <div class="ad-label">ADVERTISEMENT</div>
  </div>

  <div class="tabs">
    <button class="tab active" data-slot="1pm">1:00 PM</button>
    <button class="tab" data-slot="6pm">6:00 PM</button>
    <button class="tab" data-slot="8pm">8:00 PM</button>
  </div>

  <div class="panel">
    <div id="imageArea" class="empty loading">
      Loading result image...
    </div>
  </div>

  <div class="ad-box">
    <div class="ad-label">ADVERTISEMENT</div>
  </div>

  <div class="top-info">
    <span id="lastUpdated">Last updated: --</span>
    <span>Auto refresh: 60 seconds</span>
  </div>

</main>

<footer>
  <strong>KR KHAN</strong><br>
  ROYAL RESULTS<br>
  Premium • Live • Daily Updates
</footer>

<script>
const API_URL = "./results.json";
const REFRESH_INTERVAL = 60000;
const IST_ZONE = "Asia/Kolkata";

let allData = null;
let activeSlot = "1pm";
let lastImageKey = "";

const imageArea = document.getElementById("imageArea");
const connection = document.getElementById("connection");

function getISTParts(){
  const parts = new Intl.DateTimeFormat("en-GB",{
    timeZone:IST_ZONE,
    year:"numeric",
    month:"2-digit",
    day:"2-digit",
    hour:"2-digit",
    minute:"2-digit",
    hourCycle:"h23"
  }).formatToParts(new Date());

  const values = {};
  parts.forEach(p => values[p.type] = p.value);
  return values;
}

function getISTDate(){
  const p = getISTParts();
  return `${p.day}-${p.month}-${p.year}`;
}

function getYesterdayDate(){
  const p = getISTParts();

  const yesterday = new Date(Date.UTC(
    Number(p.year),
    Number(p.month)-1,
    Number(p.day)-1
  ));

  return [
    String(yesterday.getUTCDate()).padStart(2,"0"),
    String(yesterday.getUTCMonth()+1).padStart(2,"0"),
    yesterday.getUTCFullYear()
  ].join("-");
}

function isBeforeOnePM(){
  return Number(getISTParts().hour) < 13;
}

function getImageUrl(item, expectedDate){
  if(!item || item.success !== true || !item.data) return "";

  const data = item.data;

  if(data.date !== expectedDate) return "";

  if(String(data.status || "").toLowerCase() === "upcoming"){
    return "";
  }

  const url = data.files && data.files.jpg;

  if(typeof url !== "string" || !url.trim()) return "";

  try{
    const parsed = new URL(url);
    if(parsed.protocol !== "https:" && parsed.protocol !== "http:"){
      return "";
    }
    return parsed.href;
  }catch(error){
    return "";
  }
}

function getSelectedImage(){
  if(!allData) return null;

  const today = getISTDate();
  const yesterday = getYesterdayDate();

  const results = allData.results || {};
  const history = allData.history || {};

  // Today's image is shown only when JSON belongs to today.
  if(allData.date === today){
    const todayItem = results[activeSlot];
    const todayImage = getImageUrl(todayItem,today);

    if(todayImage){
      return {
        url:todayImage,
        date:today,
        source:"today"
      };
    }
  }

  // Before 1 PM, yesterday's image may remain visible.
  if(isBeforeOnePM()){
    const oldItem =
      (history[yesterday] && history[yesterday][activeSlot]) ||
      (
        results[activeSlot] &&
        results[activeSlot].data &&
        results[activeSlot].data.date === yesterday
          ? results[activeSlot]
          : null
      );

    const oldImage = getImageUrl(oldItem,yesterday);

    if(oldImage){
      return {
        url:oldImage,
        date:yesterday,
        source:"history"
      };
    }
  }

  // After 1 PM, yesterday's image is never displayed.
  return null;
}

function showEmpty(message){
  imageArea.innerHTML =
    '<div class="empty">' + message + '</div>';
  lastImageKey = "";
}

function renderImage(){
  const selected = getSelectedImage();

  if(!selected){
    showEmpty("Result image is not available yet.");
    return;
  }

  const imageKey = selected.date + "|" + selected.url;

  if(imageKey === lastImageKey) return;

  lastImageKey = imageKey;

  imageArea.innerHTML = "";

  const wrapper = document.createElement("div");
  wrapper.className = "image-wrap";

  const img = document.createElement("img");
  img.className = "result-image";
  img.alt = "KR KHAN Lottery Result Image";
  img.loading = "eager";
  img.src = selected.url;

  img.onerror = function(){
    showEmpty("Result image could not be loaded.");
  };

  wrapper.appendChild(img);
  imageArea.appendChild(wrapper);
}

async function loadResults(){
  connection.textContent = "● Updating...";
  connection.className = "loading";

  try{
    const response = await fetch(
      API_URL + "?t=" + Date.now(),
      {cache:"no-store"}
    );

    if(!response.ok){
      throw new Error("HTTP Error " + response.status);
    }

    const data = await response.json();

    if(!data || !data.results){
      throw new Error("Invalid results.json");
    }

    allData = data;

    connection.textContent = "● Connected";
    connection.className = "status";

    document.getElementById("dateText").textContent =
      "Today's Date: " + getISTDate() + " (IST)";

    document.getElementById("lastUpdated").textContent =
      "Last updated: " +
      new Intl.DateTimeFormat("en-IN",{
        timeZone:IST_ZONE,
        hour:"2-digit",
        minute:"2-digit",
        second:"2-digit",
        hour12:true
      }).format(new Date());

    renderImage();

  }catch(error){
    connection.textContent = "● Connection Error";
    connection.className = "error";

    if(!allData){
      showEmpty("Unable to load result image. Please try again later.");
    }
  }
}

// Slot selection
document.querySelectorAll(".tab").forEach(button => {
  button.addEventListener("click",function(){
    document.querySelectorAll(".tab").forEach(tab => {
      tab.classList.remove("active");
    });

    this.classList.add("active");
    activeSlot = this.dataset.slot;
    lastImageKey = "";
    renderImage();
  });
});

// Automatic refresh
loadResults();
setInterval(loadResults,REFRESH_INTERVAL);

// Check Indian date and 1 PM boundary every 10 seconds
setInterval(() => {
  document.getElementById("dateText").textContent =
    "Today's Date: " + getISTDate() + " (IST)";

  renderImage();
},10000);

</script>
</body>
</html>
