
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">
<title>KR KHAN - Royal Results</title>

<style>
:root{
  --bg:#080808;
  --panel:#141414;
  --gold:#d6ad55;
  --gold2:#f8df91;
  --text:#f5f5f5;
  --muted:#999;
  --border:rgba(214,173,85,.25);
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
}
.container{width:94%;max-width:950px;margin:auto}

header{
  background:linear-gradient(135deg,#17130b,#080808);
  border-bottom:1px solid var(--border);
  padding:20px 0;
}
.brand{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
}
.logo{width:65px;height:65px;flex-shrink:0}
.brand-name{
  font-size:29px;
  font-weight:900;
  letter-spacing:3px;
  color:var(--gold2);
  text-shadow:0 0 15px rgba(214,173,85,.3);
}
.brand-sub{
  font-size:10px;
  letter-spacing:4px;
  color:var(--gold);
  margin-top:5px;
  text-align:center;
}
.tagline{
  text-align:center;
  color:#aaa;
  font-size:10px;
  letter-spacing:2px;
  margin-top:13px;
}
.top-info{
  display:flex;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
  margin:18px 0;
  color:var(--muted);
  font-size:12px;
}
.status{color:#5de69b}
.error{color:#ff7979}
.loading{color:var(--gold2)}

.tabs{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
  margin:20px 0;
}
.tab{
  border:1px solid var(--border);
  background:#151515;
  color:#aaa;
  padding:15px 5px;
  border-radius:9px;
  font-size:14px;
  font-weight:bold;
  cursor:pointer;
}
.tab.active{
  color:#111;
  background:linear-gradient(135deg,var(--gold2),var(--gold));
  border-color:var(--gold);
}
.panel{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:13px;
  padding:12px;
  margin-bottom:16px;
}

/* WINNING NUMBER CARD */
.winner-card{
  display:none;
  position:relative;
  overflow:hidden;
  text-align:center;
  padding:24px 12px;
  margin-bottom:13px;
  border:1px solid rgba(214,173,85,.55);
  border-radius:12px;
  background:
    radial-gradient(ellipse at top,rgba(214,173,85,.17),transparent 70%),
    linear-gradient(145deg,#201a0d,#0c0c0c 65%);
  box-shadow:0 5px 25px rgba(0,0,0,.35);
}
.winner-card.visible{display:block}
.winner-label{
  color:var(--gold);
  font-size:11px;
  font-weight:bold;
  letter-spacing:3px;
  margin-bottom:12px;
}
.winner-number{
  color:var(--gold2);
  font-size:clamp(30px,8vw,52px);
  font-weight:900;
  letter-spacing:3px;
  line-height:1.2;
  text-shadow:0 0 18px rgba(214,173,85,.35);
  overflow-wrap:anywhere;
}
.winner-amount{
  color:#fff;
  font-size:clamp(23px,6vw,34px);
  font-weight:900;
  margin-top:13px;
}
.winner-prize{
  display:inline-block;
  margin-top:13px;
  padding:7px 16px;
  border-radius:30px;
  border:1px solid var(--gold);
  color:var(--gold2);
  font-size:10px;
  font-weight:bold;
  letter-spacing:2px;
  background:rgba(214,173,85,.09);
}
.winner-name{
  color:#aaa;
  font-size:11px;
  margin-top:12px;
  letter-spacing:1px;
}

.image-wrap{
  width:100%;
  overflow:hidden;
  border-radius:8px;
  background:#090909;
}
.result-image{
  display:block;
  width:100%;
  height:auto;
  object-fit:contain;
  border-radius:8px;
}
.result-pdf{
  display:block;
  width:100%;
  height:75vh;
  min-height:450px;
  border:0;
  border-radius:8px;
  background:#fff;
}

/* FORMAT SWITCH */
.format-switch{
  display:none;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
  margin-top:13px;
}
.format-switch.visible{display:grid}
.format-btn{
  padding:12px 5px;
  border:1px solid var(--border);
  border-radius:8px;
  background:#101010;
  color:#aaa;
  font-size:12px;
  font-weight:bold;
  letter-spacing:1px;
  cursor:pointer;
}
.format-btn.active{
  color:#111;
  background:linear-gradient(135deg,var(--gold2),var(--gold));
  border-color:var(--gold);
}
.format-btn:disabled{
  opacity:.35;
  cursor:not-allowed;
}

.empty{
  text-align:center;
  color:#aaa;
  padding:45px 12px;
  line-height:1.8;
  font-size:14px;
}

/* ADVERTISEMENT STYLING */
.ad-box{
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  width:100%;
  margin:18px auto;
  text-align:center;
  overflow:hidden;
}
.ad-label{
  color:#555;
  font-size:9px;
  letter-spacing:2px;
  margin-bottom:7px;
}
.ad-468{
  max-width:468px;
  min-height:60px;
}
.ad-300{
  max-width:300px;
  min-height:250px;
}
.ad-box iframe{
  max-width:100%;
  border:0;
}

footer{
  text-align:center;
  padding:25px 10px;
  color:#888;
  border-top:1px solid var(--border);
  margin-top:25px;
  font-size:12px;
  line-height:2;
}
footer strong{color:var(--gold)}

@media(max-width:550px){
  .container{width:93%}
  .brand-name{font-size:24px}
  .logo{width:55px;height:55px}
  .panel{padding:8px}
  .tab{font-size:12px;padding:14px 3px}
  .ad-468 iframe{max-width:100% !important}
  .winner-card{padding:21px 8px}
  .winner-number{letter-spacing:2px}
  .result-pdf{height:70vh;min-height:400px}
  .format-btn{font-size:11px;padding:12px 3px}
}
</style>
</head>

<body>

<header>
  <div class="container">
    <div class="brand">
      <svg class="logo" viewBox="0 0 100 100"
        xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#fff0b5"/>
            <stop offset="45%" stop-color="#d6ad55"/>
            <stop offset="100%" stop-color="#8c6425"/>
          </linearGradient>
        </defs>
        <path d="M50 3 L94 27 L94 73 L50 97 L6 73 L6 27 Z"
          fill="none" stroke="url(#gold)" stroke-width="3"/>
        <path d="M25 25 V75 M25 50 L52 25 M35 43 L58 75"
          fill="none" stroke="url(#gold)" stroke-width="7"
          stroke-linecap="square" stroke-linejoin="miter"/>
        <path d="M58 25 L76 75 M76 25 L58 75"
          fill="none" stroke="url(#gold)" stroke-width="5"/>
      </svg>

      <div>
        <div class="brand-name">KR KHAN</div>
        <div class="brand-sub">ROYAL RESULTS</div>
      </div>
    </div>

    <div class="tagline">PREMIUM • LIVE • DAILY UPDATES</div>
  </div>
</header>

<main class="container">

  <div class="top-info">
    <span id="dateText">Loading date...</span>
    <span id="connection" class="status">● Connecting...</span>
  </div>

  <!-- ADVERTISEMENT 468x60 -->
  <div class="ad-box ad-468">
    <div class="ad-label">ADVERTISEMENT</div>

    <script>
      atOptions = {
        'key' : 'a5b80e67d65f773f39f9edd52d25fdda',
        'format' : 'iframe',
        'height' : 60,
        'width' : 468,
        'params' : {}
      };
    </script>
    <script data-cfasync="false"
      src="https://bicea.org/22/a5b80e67d65f773f39f9edd52d25fdda">
    </script>
  </div>

  <div class="tabs">
    <button class="tab active" data-slot="1pm">1:00 PM</button>
    <button class="tab" data-slot="6pm">6:00 PM</button>
    <button class="tab" data-slot="8pm">8:00 PM</button>
  </div>

  <div class="panel">

    <div id="winnerCard" class="winner-card">
      <div class="winner-label">TODAY'S FIRST PRIZE WINNER</div>
      <div id="winnerNumber" class="winner-number"></div>
      <div id="winnerAmount" class="winner-amount"></div>
      <div class="winner-prize">★ FIRST PRIZE ★</div>
      <div id="winnerName" class="winner-name"></div>
    </div>

    <!-- RESULT VIEWER -->
    <div id="imageArea" class="empty loading">
      Loading result...
    </div>

    <!-- FORMAT BUTTONS -->
    <div id="formatSwitch" class="format-switch">
      <button class="format-btn active" data-format="jpg">JPG</button>
      <button class="format-btn" data-format="webp">WEBP</button>
      <button class="format-btn" data-format="pdf">PDF</button>
    </div>

  </div>

  <!-- ADVERTISEMENT 300x250 -->
  <div class="ad-box ad-300">
    <div class="ad-label">ADVERTISEMENT</div>

    <script>
      atOptions = {
        'key' : 'b166761d8a76989d6fa88b8d15605b87',
        'format' : 'iframe',
        'height' : 250,
        'width' : 300,
        'params' : {}
      };
    </script>
    <script data-cfasync="false"
      src="https://bicea.org/22/b166761d8a76989d6fa88b8d15605b87">
    </script>
  </div>

  <div class="top-info">
    <span id="lastUpdated">Last updated: --</span>
    <span>Auto refresh: 60 seconds</span>
  </div>

</main>

<footer>
  <strong>KR KHAN</strong><br>
  ROYAL RESULTS<br>
  Premium • Live • Daily Updates
</footer>

<script>
const API_URL = "./results.json";
const REFRESH_INTERVAL = 60000;
const IST_ZONE = "Asia/Kolkata";

let allData = null;
let activeSlot = "1pm";
let selectedFormat = "jpg";
let lastViewerKey = "";
let currentFiles = {};

const imageArea = document.getElementById("imageArea");
const connection = document.getElementById("connection");
const winnerCard = document.getElementById("winnerCard");
const formatSwitch = document.getElementById("formatSwitch");

function getISTParts(){

  const parts = new Intl.DateTimeFormat("en-GB",{
    timeZone:IST_ZONE,
    year:"numeric",
    month:"2-digit",
    day:"2-digit",
    hour:"2-digit",
    minute:"2-digit",
    hourCycle:"h23"
  }).formatToParts(new Date());

  const values = {};
  parts.forEach(p => values[p.type] = p.value);

  return values;
}

function getISTDate(){

  const p = getISTParts();
  return `${p.day}-${p.month}-${p.year}`;
}

function getYesterdayDate(){

  const p = getISTParts();

  const yesterday = new Date(Date.UTC(
    Number(p.year),
    Number(p.month)-1,
    Number(p.day)-1
  ));

  return [
    String(yesterday.getUTCDate()).padStart(2,"0"),
    String(yesterday.getUTCMonth()+1).padStart(2,"0"),
    yesterday.getUTCFullYear()
  ].join("-");
}

function isBeforeOnePM(){
  return Number(getISTParts().hour) < 13;
}

/* VALIDATE FILE URL */

function getValidUrl(url){

  if(typeof url !== "string" || !url.trim()){
    return "";
  }

  try{
    const parsed = new URL(url);

    if(
      parsed.protocol !== "https:" &&
      parsed.protocol !== "http:"
    ){
      return "";
    }

    return parsed.href;

  }catch(error){
    return "";
  }
}

/* GET AVAILABLE RESULT FILES */

function getResultFiles(item, expectedDate){

  if(!item || item.success !== true || !item.data){
    return null;
  }

  const data = item.data;

  if(data.date !== expectedDate){
    return null;
  }

  if(String(data.status || "").toLowerCase() !== "published"){
    return null;
  }

  const sourceFiles = data.files || {};

  const files = {
    jpg:getValidUrl(sourceFiles.jpg),
    webp:getValidUrl(sourceFiles.webp),
    pdf:getValidUrl(sourceFiles.pdf)
  };

  if(!files.jpg && !files.webp && !files.pdf){
    return null;
  }

  return files;
}

/* GET TODAY OR YESTERDAY RESULT */

function getSelectedResult(){

  if(!allData){
    return null;
  }

  const today = getISTDate();
  const yesterday = getYesterdayDate();

  const results = allData.results || {};
  const history = allData.history || {};

  if(allData.date === today){

    const todayItem = results[activeSlot];
    const todayFiles = getResultFiles(todayItem,today);

    if(todayFiles){
      return {
        item:todayItem,
        files:todayFiles,
        date:today,
        source:"today"
      };
    }
  }

  if(isBeforeOnePM()){

    const oldItem =
      (history[yesterday] && history[yesterday][activeSlot]) ||
      (
        results[activeSlot] &&
        results[activeSlot].data &&
        results[activeSlot].data.date === yesterday
          ? results[activeSlot]
          : null
      );

    const oldFiles = getResultFiles(oldItem,yesterday);

    if(oldFiles){
      return {
        item:oldItem,
        files:oldFiles,
        date:yesterday,
        source:"history"
      };
    }
  }

  return null;
}

/* SHOW WINNING NUMBER */

function renderWinner(item){

  const data = item && item.data;

  if(
    !data ||
    String(data.status || "").toLowerCase() !== "published"
  ){
    winnerCard.classList.remove("visible");
    return;
  }

  const first = data.first;

  if(!first || typeof first !== "object"){
    winnerCard.classList.remove("visible");
    return;
  }

  const series = String(first.series || "").trim();
  const number = String(first.number || "").trim();
  const amount = Number(first.amount);

  if(!series || !number || !Number.isFinite(amount) || amount <= 0){
    winnerCard.classList.remove("visible");
    return;
  }

  document.getElementById("winnerNumber").textContent =
    series + " " + number;

  document.getElementById("winnerAmount").textContent =
    "₹" + new Intl.NumberFormat("en-IN").format(amount);

  document.getElementById("winnerName").textContent =
    data.name || "Official Lottery Result";

  winnerCard.classList.add("visible");
}

/* FORMAT BUTTONS */

function updateFormatButtons(files){

  currentFiles = files || {};

  const availableFormats = ["jpg","webp","pdf"].filter(
    format => Boolean(currentFiles[format])
  );

  if(availableFormats.length === 0){
    formatSwitch.classList.remove("visible");
    return false;
  }

  if(!currentFiles[selectedFormat]){
    selectedFormat = availableFormats[0];
  }

  document.querySelectorAll(".format-btn").forEach(button => {

    const format = button.dataset.format;
    const available = Boolean(currentFiles[format]);

    button.disabled = !available;
    button.style.display = available ? "block" : "none";

    button.classList.toggle(
      "active",
      format === selectedFormat
    );
  });

  formatSwitch.classList.add("visible");

  return true;
}

/* EMPTY MESSAGE */

function showEmpty(message){

  winnerCard.classList.remove("visible");
  formatSwitch.classList.remove("visible");

  imageArea.innerHTML = "";

  const div = document.createElement("div");
  div.className = "empty";
  div.textContent = message;

  imageArea.appendChild(div);

  currentFiles = {};
  lastViewerKey = "";
}

/* RENDER SELECTED FORMAT */

function renderSelectedFormat(selected){

  if(!selected){
    showEmpty("Result image is not available yet.");
    return;
  }

  renderWinner(selected.item);

  const files = selected.files || {};

  if(!updateFormatButtons(files)){
    showEmpty("Result file is not available yet.");
    return;
  }

  const url = files[selectedFormat];

  const viewerKey =
    selected.date + "|" +
    activeSlot + "|" +
    selectedFormat + "|" +
    url;

  if(viewerKey === lastViewerKey){
    return;
  }

  lastViewerKey = viewerKey;
  imageArea.innerHTML = "";

  if(selectedFormat === "jpg" || selectedFormat === "webp"){

    const wrapper = document.createElement("div");
    wrapper.className = "image-wrap";

    const img = document.createElement("img");

    img.className = "result-image";
    img.alt = "KR KHAN Official Lottery Result";
    img.loading = "eager";
    img.src = url;

    img.onerror = function(){

      showEmpty("Result image could not be loaded.");
    };

    wrapper.appendChild(img);
    imageArea.appendChild(wrapper);

  }else if(selectedFormat === "pdf"){

    const wrapper = document.createElement("div");
    wrapper.className = "image-wrap";

    const pdf = document.createElement("iframe");

    pdf.className = "result-pdf";
    pdf.src = url;
    pdf.title = "Official Lottery Result PDF";
    pdf.loading = "lazy";

    wrapper.appendChild(pdf);
    imageArea.appendChild(wrapper);
  }
}

/* RENDER RESULT */

function renderImage(){

  const selected = getSelectedResult();

  if(!selected){
    showEmpty("Result image is not available yet.");
    return;
  }

  renderSelectedFormat(selected);
}

/* LOAD JSON */

async function loadResults(){

  connection.textContent = "● Updating...";
  connection.className = "loading";

  try{

    const response = await fetch(
      API_URL + "?t=" + Date.now(),
      {cache:"no-store"}
    );

    if(!response.ok){
      throw new Error("HTTP Error " + response.status);
    }

    const data = await response.json();

    if(!data || !data.results){
      throw new Error("Invalid results.json");
    }

    allData = data;

    connection.textContent = "● Connected";
    connection.className = "status";

    document.getElementById("dateText").textContent =
      "Today's Date: " + getISTDate() + " (IST)";

    document.getElementById("lastUpdated").textContent =
      "Last updated: " +
      new Intl.DateTimeFormat("en-IN",{
        timeZone:IST_ZONE,
        hour:"2-digit",
        minute:"2-digit",
        second:"2-digit",
        hour12:true
      }).format(new Date());

    renderImage();

  }catch(error){

    connection.textContent = "● Connection Error";
    connection.className = "error";

    if(!allData){
      showEmpty(
        "Unable to load result. Please try again later."
      );
    }
  }
}

/* SLOT SELECTION */

document.querySelectorAll(".tab").forEach(button => {

  button.addEventListener("click",function(){

    document.querySelectorAll(".tab").forEach(tab => {
      tab.classList.remove("active");
    });

    this.classList.add("active");

    activeSlot = this.dataset.slot;

    selectedFormat = "jpg";
    lastViewerKey = "";

    renderImage();
  });
});

/* FORMAT SELECTION */

document.querySelectorAll(".format-btn").forEach(button => {

  button.addEventListener("click",function(){

    const format = this.dataset.format;

    if(!currentFiles[format]){
      return;
    }

    selectedFormat = format;
    lastViewerKey = "";

    renderImage();
  });
});

/* AUTO REFRESH */

loadResults();

setInterval(loadResults,REFRESH_INTERVAL);

/* CHECK IST DATE AND 1 PM BOUNDARY */

setInterval(() => {

  document.getElementById("dateText").textContent =
    "Today's Date: " + getISTDate() + " (IST)";

  renderImage();

},10000);

</script>

</body>
</html>
