name: Lottery Automatic Result Update

on:
  schedule:
    - cron: "35 7 * * *"
    - cron: "35 12 * * *"
    - cron: "35 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-results:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Lottery Results
        env:
          LOTTERY_API_KEY: ${{ secrets.LOTTERY_API_KEY }}
        run: python fetch_results.py

      - name: Save Results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results.json
          git diff --cached --quiet || git commit -m "Update Lottery Results"
          git push
