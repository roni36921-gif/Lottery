
name: Lottery Automatic Result Update

on:
  schedule:
    # 1:30 PM IST - Check for 3 hours
    - cron: "35-55/5 8 * * *"
    - cron: "*/5 9-10 * * *"
    - cron: "0-30/5 11 * * *"

    # 6:30 PM IST - Check for 3 hours
    - cron: "35-55/5 13 * * *"
    - cron: "*/5 14-15 * * *"
    - cron: "0-30/5 16 * * *"

    # 8:30 PM IST - Check for 3 hours
    - cron: "35-55/5 15 * * *"
    - cron: "*/5 16-17 * * *"
    - cron: "0-30/5 18 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lottery-result-update
  cancel-in-progress: false

jobs:
  update-results:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Lottery Results
        env:
          LOTTERY_API_KEY: ${{ secrets.LOTTERY_API_KEY }}
        run: python fetch_results.py

      - name: Save Results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results.json
          git diff --cached --quiet || git commit -m "Update Lottery Results"
          git push
